<!DOCTYPE html>

<head><script>window.__RPM_READONLY__ = true; window.__RPM_JAMS__ = true; window.__RPM_STUDENT__ = false;</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Read &amp; Play Music</title>
  <link rel="icon" type="image/png" sizes="any" href="/icon.png">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="shortcut icon" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#9B6BFF">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((e) => console.log('SW reg failed:', e));
      });
    }
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Read&amp;Play">
  <meta name="application-name" content="Read&amp;Play">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@300;400;700&family=Open+Sans:wght@300;400&family=DM+Sans:wght@300;400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Music&display=swap" crossorigin="anonymous" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@300;400;700&family=Open+Sans:wght@300;400&family=DM+Sans:wght@300;400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Music&display=swap" crossorigin="anonymous"></noscript>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100dvh; overflow: hidden; }

    /* iPad portrait: show rotate message */
    #rotate-overlay {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #000; z-index: 99999;
      flex-direction: column; justify-content: center; align-items: center;
      color: #fff; font-family: 'DM Sans', sans-serif; text-align: center;
    }
    #rotate-overlay .rotate-icon {
      font-size: 80px; margin-bottom: 24px;
    }
    #rotate-overlay .rotate-text {
      font-size: 28px; font-weight: 600;
    }
    @media (orientation: portrait) {
      #rotate-overlay { display: flex; }
      #root { display: none; }
    }
  </style>
</head>
<body>
  <div id="rotate-overlay">
    <div class="rotate-icon">&#x1F4F1;&#x21BB;</div>
    <div class="rotate-text">Please rotate your device to landscape</div>
  </div>
  <div id="root"></div>
  <script src="/keyboard/vendor/react.production.min.js" crossorigin="anonymous"></script>
  <script src="/keyboard/vendor/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script>
    // Server-side storage API
    window.noteforgeAPI = {
      async listSongs() {
        try {
          const res = await fetch('/api/songs');
          return await res.json();
        } catch (e) { console.error('List failed:', e); return []; }
      },
      async saveSong(song, oldTitle, opts) {
        try {
          const res = await fetch('/api/songs', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ song, oldTitle, loadedFrom: opts && opts.loadedFrom, allowOverwrite: !!(opts && opts.allowOverwrite) }),
          });
          if (res.status === 409) {
            const data = await res.json().catch(() => ({}));
            console.warn('Save blocked — would overwrite different song:', data.existingTitle);
            return { blocked: true, existingTitle: data.existingTitle };
          }
          return res.ok;
        } catch (e) { console.error('Save failed:', e); return false; }
      },
      async deleteSong(filename) {
        try {
          const res = await fetch('/api/songs/' + encodeURIComponent(filename), { method: 'DELETE', credentials: 'include' });
          return res.ok;
        } catch (e) { return false; }
      },
      async getState() {
        try {
          const res = await fetch('/api/state');
          return await res.json();
        } catch (e) { return {}; }
      },
      async saveState(state) {
        try {
          await fetch('/api/state', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(state),
          });
        } catch (e) { /* ignore */ }
      },
      async getDirectory() {
        try {
          const res = await fetch('/api/directory');
          const data = await res.json();
          return data.directory;
        } catch (e) { return null; }
      },
      async setDirectory(dir) {
        try {
          const res = await fetch('/api/directory', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ directory: dir }),
          });
          const data = await res.json();
          return data.ok ? data.directory : null;
        } catch (e) { return null; }
      },
      async browse(dirPath) {
        try {
          const res = await fetch('/api/browse?path=' + encodeURIComponent(dirPath || ''));
          return await res.json();
        } catch (e) { return null; }
      },
    };
  </script>
  <script src="/keyboard/app.js?r1777336087" defer></script>
</body>
</html>
