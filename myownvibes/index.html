<script>
  // Separate instrument libraries (owner 2026-09-28: "the library of every
  // instrument should be separate"). On a guitar page every song request goes
  // to the guitar's own library: /api/songs → /api/guitar/songs, and the same
  // for /api/published, /api/publish, /api/unpublish, /api/lessons. Works on
  // localhost, the cloud editor and the static public site alike.
  (function () {
    var LIBS = { guitar: 1, conductor: 1 };
    function lib() {
      if (window.__RPM_GUITAR__) return 'guitar';
      // The conductor keeps its own library too (owner 2026-09-30). Its songs
      // are full orchestral scores, not an instrument's repertoire: the piece
      // the rooms' parts hang off. The flag is injected right after <head>,
      // so it is already set by the time any fetch calls this.
      if (window.__RPM_CONDUCTOR__) return 'conductor';
      var m = location.pathname.match(/\/(guitar|conductor)\/library\/?$/);
      if (m) return m[1];
      try { var q = new URLSearchParams(location.search).get('instrument'); if (q && LIBS[q]) return q; } catch (e) {}
      return null;
    }
    window.__rpmSongLibrary = lib;
    var origFetch = window.fetch;
    window.fetch = function (input, init) {
      try {
        var l = lib();
        if (l && typeof input === 'string') {
          var m = input.match(/^\/api\/(songs|published|publish|unpublish|lessons)(\/[^?]*|)(\?.*)?$/);
          if (m) input = '/api/' + l + '/' + m[1] + (m[2] || '') + (m[3] || '');
        }
      } catch (e) {}
      return origFetch.call(this, input, init);
    };
  })();

  <!-- ─── Localhost dev auto-reload ───────────────────────────────────
       The server pre-compiles index.html into a versioned app bundle and
       cache-busts that version on every edit. An already-open tab keeps
       running the old bundle until reloaded. This watcher polls the current
       page for a newer bundle version and reloads the tab automatically, so
       edits appear without a manual refresh. Self-gated to localhost / LAN —
       a NO-OP on readandplaymusic.app, so it never affects the live site. -->
  <script>
  (function () {
    var h = location.hostname;
    var isDev = /^(localhost|127\.0\.0\.1)$/.test(h) || h === '::1'
      || /^192\.168\./.test(h) || /^10\./.test(h)
      || /^172\.(1[6-9]|2\d|3[01])\./.test(h) || /\.local$/i.test(h)
      // The owner's iPad views localhost through the Cloudflare tunnel at this
      // host — treat it as a dev origin so edits auto-reload there too. The LIVE
      // site is readandplaymusic.app (NOT conductor.*), so it stays inert.
      || h === 'conductor.readandplaymusic.app' || h === 'mirror.readandplaymusic.app';
    if (!isDev) return;
    // The hold only counts where its on-screen control shows (the edit page). A hold left on from editing
    // used to freeze the play page on an old copy with no visible way out (owner 2026-11-03: "fix the
    // pause button i've been asking you to fix" - her tab never received the fix).
    function paused() { return window.__RPM_READONLY__ === false && localStorage.getItem('rpmPauseReload') === '1'; }
    function start() {
      var s = document.querySelector('script[src^="/app.js"]');
      var m = s && s.getAttribute('src').match(/app\.js\?(.+)$/);
      var myVer = m && m[1];
      if (!myVer) return;
      setInterval(function () {
        fetch(location.pathname + '?_lr=' + Date.now(), { cache: 'no-store', credentials: 'same-origin' })
          .then(function (r) { return r.text(); })
          .then(function (t) {
            // Parse the fetched HTML and read the real bundle script element's
            // src, so incidental text elsewhere on the page can't false-match.
            var sc = new DOMParser().parseFromString(t, 'text/html')
              .querySelector('script[src^="/app.js"]');
            var mm = sc && sc.getAttribute('src').match(/app\.js\?(.+)$/);
            if (mm && mm[1] !== myVer) {
              // A newer bundle exists. If the owner PAUSED updates (e.g. mid-edit),
              // hold the reload and flag it as waiting so the on-screen control can
              // light up — she picks it up on Resume. Otherwise reload as before.
              if (paused()) localStorage.setItem('rpmUpdatePending', '1');
              else location.reload();
            }
          })
          .catch(function () {});
      }, 2000);
    }
    // Floating Pause/Resume control — edit mode only (window.__RPM_READONLY__
    // === false). Lets the owner freeze auto-reloads while editing so a UI
    // rebuild never reloads her mid-edit; Resume re-enables and, if an update
    // arrived while paused, reloads to pick it up. One editor, she's in control.
    function control() {
      var btn = document.createElement('button');
      btn.id = 'rpm-reload-ctl';
      btn.style.cssText = 'position:fixed;bottom:12px;left:12px;z-index:9000;'
        + 'font:600 12px system-ui,-apple-system,sans-serif;padding:7px 11px;'
        + 'border-radius:8px;border:1px solid #cbd5e1;color:#1a1a1a;'
        + 'box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;display:none;';
      function render() {
        var editing = window.__RPM_READONLY__ === false;
        btn.style.display = editing ? 'block' : 'none';
        var p = paused(), pend = localStorage.getItem('rpmUpdatePending') === '1';
        btn.textContent = p ? (pend ? '🔄 Resume — update ready' : '▶ Resume updates') : '⏸ Pause updates';
        btn.style.background = p ? (pend ? '#fde68a' : '#e5e7eb') : '#ffffff';
        btn.title = p ? "Auto-updates paused — you won't be reloaded. Click to resume."
                      : "Pause auto-updates so a fix never reloads you mid-edit.";
      }
      btn.onclick = function () {
        if (paused()) {
          localStorage.removeItem('rpmPauseReload');
          if (localStorage.getItem('rpmUpdatePending') === '1') {
            localStorage.removeItem('rpmUpdatePending');
            location.reload();
            return;
          }
        } else {
          localStorage.setItem('rpmPauseReload', '1');
        }
        render();
      };
      document.body.appendChild(btn);
      render();
      setInterval(render, 1500);
    }
    // ↶ Undo / ↷ Redo Claude's changes (owner 2026-10-20: "a tab where i can just
    // undo what you did ... and there should also be a forward button"). Dev pages
    // only. Each step is one change Claude made (scripts/claude-checkpoint.py);
    // Undo takes back only Claude's lines, so other windows' edits stay.
    function undoTab() {
      var box = document.createElement('div');
      box.id = 'rpm-claude-undo';
      box.style.cssText = 'position:fixed;bottom:52px;left:12px;z-index:9000;display:flex;gap:4px;align-items:center;'
        + 'font:600 12px system-ui,-apple-system,sans-serif;background:#fff;border:1px solid #cbd5e1;border-radius:8px;'
        + 'padding:4px 6px;box-shadow:0 2px 8px rgba(0,0,0,.15);color:#1a1a1a;';
      var lab = document.createElement('span'); lab.textContent = 'Claude'; lab.style.cssText = 'padding:0 4px;color:#64748b;';
      function mk(txt) { var b = document.createElement('button'); b.textContent = txt;
        b.style.cssText = 'font:inherit;padding:4px 9px;border-radius:6px;border:1px solid #cbd5e1;background:#f8fafc;cursor:pointer;';
        return b; }
      var u = mk('\u21B6 Undo'), r = mk('Redo \u21B7');
      box.appendChild(lab); box.appendChild(u); box.appendChild(r);
      function show(st) {
        u.disabled = !st.undo; r.disabled = !st.redo;
        u.style.opacity = st.undo ? '1' : '.4'; r.style.opacity = st.redo ? '1' : '.4';
        u.title = st.undo ? 'Undo: ' + st.undo : 'Nothing to undo';
        r.title = st.redo ? 'Redo: ' + st.redo : 'Nothing to redo';
      }
      function refresh() {
        fetch('/api/dev/checkpoints', { cache: 'no-store', credentials: 'same-origin' })
          .then(function (x) { return x.json(); }).then(show).catch(function () { box.style.display = 'none'; });
      }
      function go(cmd) {
        fetch('/api/dev/checkpoints/' + cmd, { method: 'POST', credentials: 'same-origin', headers: { 'X-RPM-Dev': '1' } })
          .then(function (x) { return x.json(); })
          .then(function (st) {
            show(st);
            if (st.ok) location.reload();
            else if (st.message) alert(st.message);
          }).catch(function () {});
      }

      r.onclick = function () { go('redo'); };
      document.body.appendChild(box);
      // On the conductor it sits in the toolbar, between Full screen and the
      // metronome (owner 2026-10-21), styled like the toolbar's buttons.
      var floating = box.style.cssText;
      function place() {
        var slot = document.getElementById('rpm-undo-slot');
        if (slot && box.parentNode !== slot) {
          slot.appendChild(box);
          box.style.cssText = 'display:flex;gap:2px;align-items:center;height:40px;box-sizing:border-box;padding:0 3px;'
            + 'font:700 12px "DM Sans",system-ui,sans-serif;background:var(--bg3,#f1f5f9);border:1px solid var(--border,#cbd5e1);'
            + 'border-radius:8px;color:var(--text,#1a1a1a);white-space:nowrap;';
          lab.style.padding = '0 2px'; lab.style.fontSize = '11px';
          [u, r].forEach(function (b) { b.style.height = '30px'; b.style.padding = '0 6px'; b.style.background = '#fff'; });
        } else if (!slot && box.parentNode !== document.body) {
          document.body.appendChild(box); box.style.cssText = floating;
        }
        // Under the R&P logo (owner 2026-11-05: "put the claude undo redo pill under the R&P icon",
        // "i don't like it covering the piano"). Follows the logo as the centred toolbar moves.
        if (!slot) {
          var logo = document.querySelector('[data-rp-logo]');
          var lr = logo && logo.getBoundingClientRect();
          if (lr && lr.width) {
            box.style.bottom = 'auto';
            box.style.top = Math.round(lr.bottom + 14) + 'px';
            box.style.left = Math.max(4, Math.round(lr.left)) + 'px';
          } else { box.style.bottom = 'auto'; box.style.top = '72px'; box.style.left = '12px'; } // logo hidden (phone menu closed): still top-left, never over the piano
        }
      }
      place(); setInterval(place, 700); window.addEventListener('resize', place);
      refresh(); setInterval(refresh, 3000);
    }
    function init() { start(); control(); undoTab(); }
    if (document.readyState === 'complete') init();
    else window.addEventListener('load', init);
  })();

  <script>/* ScoreFile: copied verbatim from scripts/score-file.js (scripts/score-file.test.js checks they match). */
// Reads a MusicXML score from .mxl, .musicxml or .xml and returns its XML text
// exactly as stored in the file. Nothing in the score is changed or added.
//
//   const { xmlText, format } = await ScoreFile.read(file, { JSZip });
//
// Throws an Error with a plain message for anything that is not a MusicXML score.

  if (typeof module === 'object' && module.exports) module.exports = factory();

  const EXTENSIONS = ['.mxl', '.musicxml', '.xml'];

    const m = /\.[^./\\]+$/.exec(String(name || '').toLowerCase());

  function decode(bytes) {
    if (bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder('utf-16le').decode(bytes.subarray(2));
    if (bytes[0] === 0xFE && bytes[1] === 0xFF) return new TextDecoder('utf-16be').decode(bytes.subarray(2));
    return new TextDecoder('utf-8').decode(bytes).replace(/^﻿/, '');
  }

  // A MusicXML score has <score-partwise> or <score-timewise> as its root element.
  function isMusicXml(text) {
    const head = text
      .replace(/<\?xml[\s\S]*?\?>/g, '')
      .replace(/<!--[\s\S]*?-->/g, '')
      .replace(/<!DOCTYPE[^>[]*(\[[\s\S]*?\])?\s*>/gi, '');

    if (!JSZip) throw new Error('JSZip is needed to open .mxl files');
    let zip;
    try { zip = await JSZip.loadAsync(bytes); }
    catch (e) { throw new Error('This .mxl file is not a valid zip archive'); }
    let mainPath = null;
    const container = zip.file('META-INF/container.xml');
    if (container) {
      const cx = await container.async('string');
      const m = /<rootfile\b[^>]*\bfull-path\s*=\s*["']([^"']+)["']/.exec(cx);
      if (m) mainPath = m[1];

    const ext = extensionOf(file && file.name);

    }
