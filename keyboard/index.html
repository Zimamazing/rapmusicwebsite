  <!-- ─── Localhost dev auto-reload ───────────────────────────────────
       The server pre-compiles index.html into a versioned app bundle and
       cache-busts that version on every edit. An already-open tab keeps
       running the old bundle until reloaded. This watcher polls the current
       page for a newer bundle version and reloads the tab automatically, so
       edits appear without a manual refresh. Self-gated to localhost / LAN —
       a NO-OP on readandplaymusic.app, so it never affects the live site. -->
  <script>
  (function () {
    var h = location.hostname;
    var isDev = /^(localhost|127\.0\.0\.1)$/.test(h) || h === '::1'
      || /^192\.168\./.test(h) || /^10\./.test(h)
      || /^172\.(1[6-9]|2\d|3[01])\./.test(h) || /\.local$/i.test(h)
      // The owner's iPad views localhost through the Cloudflare tunnel at this
      // host — treat it as a dev origin so edits auto-reload there too. The LIVE
      // site is readandplaymusic.app (NOT mirror.*), so it stays inert.
      || h === 'mirror.readandplaymusic.app';
    if (!isDev) return;
    function paused() { return localStorage.getItem('rpmPauseReload') === '1'; }
    function start() {
      var s = document.querySelector('script[src^="/app.js"]');
      var m = s && s.getAttribute('src').match(/app\.js\?(.+)$/);
      var myVer = m && m[1];
      if (!myVer) return;
      setInterval(function () {
        fetch(location.pathname + '?_lr=' + Date.now(), { cache: 'no-store', credentials: 'same-origin' })
          .then(function (r) { return r.text(); })
          .then(function (t) {
            // Parse the fetched HTML and read the real bundle script element's
            // src, so incidental text elsewhere on the page can't false-match.
            var sc = new DOMParser().parseFromString(t, 'text/html')
              .querySelector('script[src^="/app.js"]');
            var mm = sc && sc.getAttribute('src').match(/app\.js\?(.+)$/);
            if (mm && mm[1] !== myVer) {
              // A newer bundle exists. If the owner PAUSED updates (e.g. mid-edit),
              // hold the reload and flag it as waiting so the on-screen control can
              // light up — she picks it up on Resume. Otherwise reload as before.
              if (paused()) localStorage.setItem('rpmUpdatePending', '1');
              else location.reload();
            }
          })
          .catch(function () {});
      }, 2000);
    }
    // Floating Pause/Resume control — edit mode only (window.__RPM_READONLY__
    // === false). Lets the owner freeze auto-reloads while editing so a UI
    // rebuild never reloads her mid-edit; Resume re-enables and, if an update
    // arrived while paused, reloads to pick it up. One editor, she's in control.
    function control() {
      var btn = document.createElement('button');
      btn.id = 'rpm-reload-ctl';
      btn.style.cssText = 'position:fixed;bottom:12px;left:12px;z-index:9000;'
        + 'font:600 12px system-ui,-apple-system,sans-serif;padding:7px 11px;'
        + 'border-radius:8px;border:1px solid #cbd5e1;color:#1a1a1a;'
        + 'box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;display:none;';
      function render() {
        var editing = window.__RPM_READONLY__ === false;
        btn.style.display = editing ? 'block' : 'none';
        var p = paused(), pend = localStorage.getItem('rpmUpdatePending') === '1';
        btn.textContent = p ? (pend ? '🔄 Resume — update ready' : '▶ Resume updates') : '⏸ Pause updates';
        btn.style.background = p ? (pend ? '#fde68a' : '#e5e7eb') : '#ffffff';
        btn.title = p ? "Auto-updates paused — you won't be reloaded. Click to resume."
                      : "Pause auto-updates so a fix never reloads you mid-edit.";
      }
      btn.onclick = function () {
        if (paused()) {
          localStorage.removeItem('rpmPauseReload');
          if (localStorage.getItem('rpmUpdatePending') === '1') {
            localStorage.removeItem('rpmUpdatePending');
            location.reload();
            return;
          }
        } else {
          localStorage.setItem('rpmPauseReload', '1');
        }
        render();
      };
      document.body.appendChild(btn);
      render();
      setInterval(render, 1500);
    }
    function init() { start(); control(); }
    if (document.readyState === 'complete') init();
    else window.addEventListener('load', init);
  })();
  </script>

    /* iPad portrait: show rotate message */

      flex-direction: column; justify-content: center; align-items: center;

    #rotate-overlay .rotate-text {
      font-size: 28px; font-weight: 600;
    }
    /* Two messages: phones/tablets (touch) get "rotate your device",
       desktops/laptops (mouse/trackpad) get "make your window wider" —
       since you can't rotate a monitor. CSS picks the right one based on
       the primary pointer type. */
    #rotate-overlay .rotate-text-touch { display: block; }
    #rotate-overlay .rotate-text-mouse { display: none; }
    @media (pointer: fine) {
      #rotate-overlay .rotate-text-touch { display: none; }
      #rotate-overlay .rotate-text-mouse { display: block; }
    }
    @media (orientation: portrait) {
      #rotate-overlay { display: flex; }
      #root { display: none; }

  <script>
    // Server-side storage API
    window.rapmusicAPI = {
      async listSongs() {
        try {
          const res = await fetch('/api/songs');
          return await res.json();
        } catch (e) { console.error('List failed:', e); return []; }
      },
      async saveSong(song, oldTitle, opts) {
        try {
          const res = await fetch('/api/songs', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ song, oldTitle, loadedFrom: opts && opts.loadedFrom, allowOverwrite: !!(opts && opts.allowOverwrite) }),
          });
          if (res.status === 409) {
            const data = await res.json().catch(() => ({}));
            console.warn('Save blocked — would overwrite different song:', data.existingTitle);
            return { blocked: true, existingTitle: data.existingTitle };
          }
          return res.ok;
        } catch (e) { console.error('Save failed:', e); return false; }
      },
      async deleteSong(filename) {
        try {
          const res = await fetch('/api/songs/' + encodeURIComponent(filename), { method: 'DELETE', credentials: 'include' });
          return res.ok;
        } catch (e) { return false; }
      },
      async getState() {
        try {
          const res = await fetch('/api/state');
          return await res.json();
        } catch (e) { return {}; }
      },
      async saveState(state) {
        try {
          await fetch('/api/state', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(state),
          });
        } catch (e) { /* ignore */ }
      },
      async getDirectory() {
        try {
          const res = await fetch('/api/directory');
          const data = await res.json();
          return data.directory;
        } catch (e) { return null; }
      },
      async setDirectory(dir) {
        try {
          const res = await fetch('/api/directory', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ directory: dir }),
          });
          const data = await res.json();
          return data.ok ? data.directory : null;
        } catch (e) { return null; }
      },
      async browse(dirPath) {
        try {
          const res = await fetch('/api/browse?path=' + encodeURIComponent(dirPath || ''));
          return await res.json();
        } catch (e) { return null; }
      },
    };
  </script>
