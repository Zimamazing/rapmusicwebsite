<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{ --bg:#fcfbf8; --text:#16181d; --text2:#6b7280; --border:#ebe9e4; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);font-family:-apple-system,'Segoe UI',sans-serif;color:var(--text);padding:48px 32px;}
  h1{font-size:26px;font-weight:800;letter-spacing:-0.02em;text-align:center;margin-bottom:6px;}
  .sub{text-align:center;color:var(--text2);margin-bottom:40px;font-size:14px;}
  .row{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;max-width:1000px;margin:0 auto;}
  .card{width:170px;background:#fff;border:1px solid var(--border);border-radius:20px;
        padding:26px 14px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;
        box-shadow:0 6px 18px rgba(0,0,0,0.05);}
  .card .art{width:108px;height:108px;}
  .card .art svg{width:100%;height:100%;display:block;}
  .card .nm{font-weight:700;font-size:16px;}
  .fam{color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:0.1em;}
</style>
</head>
<body>
  <h1>Cartoon style pilot</h1>
  <p class="sub">One per family. If you like the style, I'll draw the remaining 21 to match.</p>
  <div class="row">

    <div class="card">
      <div class="art">
        <svg viewBox="0 0 64 64"><g stroke="#2f3b50" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
          <path d="M14 41 C12 29 22 22 34 22 C47 22 55 29 53 40 C51 48 39 51 29 50 C20 49 15 48 14 41 Z" fill="#5aa9e6"/>
          <path d="M7 35 C9 33 13 33 15 35 L15 41 C13 43 9 43 7 41 Z" fill="#3f86c9"/>
          <ellipse cx="27" cy="31" rx="6" ry="3" fill="#cfe8ff" stroke="none"/>
          <circle cx="27" cy="38" r="2.3" fill="#22344e" stroke="none"/>
          <circle cx="34" cy="40" r="2.3" fill="#22344e" stroke="none"/>
          <circle cx="41" cy="38" r="2.3" fill="#22344e" stroke="none"/>
          <circle cx="37" cy="33" r="2" fill="#22344e" stroke="none"/>
        </g></svg>
      </div>
      <div class="nm">Ocarina</div><div class="fam">Aerophones</div>
    </div>

    <div class="card">
      <div class="art">
        <svg viewBox="0 0 64 64"><g stroke="#5a3c1c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
          <rect x="26" y="3" width="8" height="6" rx="1.5" fill="#6e4422"/>
          <rect x="27.5" y="7" width="5" height="16" rx="1.5" fill="#8a5a2c"/>
          <path d="M30 19 C23 19 20 24 21.5 29 C22 31.5 22 33.5 20.5 35.5 C17.5 39.5 17 46 20 51 C24 57 36 57 40 51 C43 46 42.5 39.5 39.5 35.5 C38 33.5 38 31.5 38.5 29 C40 24 37 19 30 19 Z" fill="#dca15b"/>
          <circle cx="30" cy="42" r="5" fill="#5a3b1e"/>
          <rect x="25.5" y="48" width="9" height="2.6" rx="1" fill="#6e4422" stroke="none"/>
          <ellipse cx="24" cy="30" rx="3" ry="6" fill="#f0c890" opacity="0.5" stroke="none"/>
        </g></svg>
      </div>
      <div class="nm">Guitar</div><div class="fam">Strings</div>
    </div>

    <div class="card">
      <div class="art">
        <svg viewBox="0 0 64 64"><g stroke="#8a5a12" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
          <path d="M40 22 L56 15 L56 49 L40 42 Z" fill="#f4c659"/>
          <rect x="10" y="29" width="31" height="7" rx="3.5" fill="#f2c14e"/>
          <circle cx="9" cy="32.5" r="3.5" fill="#d99b2b"/>
          <rect x="17" y="20" width="4.5" height="11" rx="2" fill="#d99b2b"/>
          <rect x="24" y="20" width="4.5" height="11" rx="2" fill="#d99b2b"/>
          <rect x="31" y="20" width="4.5" height="11" rx="2" fill="#d99b2b"/>
          <ellipse cx="48" cy="32" rx="3" ry="9" fill="#fbe7a6" opacity="0.5" stroke="none"/>
        </g></svg>
      </div>
      <div class="nm">Trumpet</div><div class="fam">Brass</div>
    </div>

    <div class="card">
      <div class="art">
        <svg viewBox="0 0 64 64"><g stroke-linejoin="round" stroke-linecap="round">
          <path d="M27 10 L27 32 C27 45 34 51 44 50 C52 49 56 42 52 36" fill="none" stroke="#8a5a12" stroke-width="11"/>
          <path d="M27 10 L27 32 C27 45 34 51 44 50 C52 49 56 42 52 36" fill="none" stroke="#f2c14e" stroke-width="7"/>
          <rect x="24.5" y="6" width="6" height="7" rx="2" fill="#d99b2b" stroke="#8a5a12" stroke-width="2"/>
          <circle cx="27" cy="20" r="1.7" fill="#7a5410" stroke="none"/>
          <circle cx="27" cy="27" r="1.7" fill="#7a5410" stroke="none"/>
          <circle cx="29" cy="34" r="1.7" fill="#7a5410" stroke="none"/>
          <circle cx="33" cy="40" r="1.7" fill="#7a5410" stroke="none"/>
        </g></svg>
      </div>
      <div class="nm">Saxophone</div><div class="fam">Woodwinds</div>
    </div>

    <div class="card">
      <div class="art">
        <svg viewBox="0 0 64 64"><g stroke="#7a2f22" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
          <line x1="12" y1="14" x2="44" y2="34" stroke="#caa46a" stroke-width="3.4"/>
          <line x1="52" y1="14" x2="20" y2="34" stroke="#b8925a" stroke-width="3.4"/>
          <rect x="14" y="30" width="36" height="18" rx="3" fill="#e0563f"/>
          <ellipse cx="32" cy="30" rx="18" ry="5.5" fill="#f4f1ea"/>
          <path d="M14 30 L14 48" /><path d="M50 30 L50 48"/>
          <rect x="19" y="33" width="2.6" height="12" rx="1" fill="#cfd6dd"/>
          <rect x="31" y="33" width="2.6" height="12" rx="1" fill="#cfd6dd"/>
          <rect x="43" y="33" width="2.6" height="12" rx="1" fill="#cfd6dd"/>
        </g></svg>
      </div>
      <div class="nm">Drums</div><div class="fam">Percussion</div>
    </div>

  </div>
</body>
</html>
